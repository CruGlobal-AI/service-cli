name: Mirror service-cli base image
# Copies digiserve/service-cli (Docker Hub, no public source repo) into GHCR.
# Multi-arch manifests are copied as-is with `docker buildx imagetools create`.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [.github/workflows/mirror.yml]
jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        tag: [master, develop]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy digiserve/service-cli:${{ matrix.tag }}
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ matrix.tag }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER,,}/service-cli:${TAG}" \
            "docker.io/digiserve/service-cli:${TAG}"
          docker buildx imagetools inspect "ghcr.io/${OWNER,,}/service-cli:${TAG}"
